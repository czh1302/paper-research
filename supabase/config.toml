project_id = "paper-research"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.create-upload]
verify_jwt = true

[functions.create-job]
verify_jwt = true

[functions.cancel-job]
verify_jwt = true

[functions.delete-job]
verify_jwt = true

[functions.create-share]
verify_jwt = true

[functions.revoke-share]
verify_jwt = true

[functions.get-share]
verify_jwt = false

[functions.admin-qr-login]
verify_jwt = false

[functions.get-source-pdf]
verify_jwt = true

[functions.set-job-favorite]
verify_jwt = true
