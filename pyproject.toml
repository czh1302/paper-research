[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paper-research-worker"
version = "0.1.0"
description = "Worker for evidence-grounded computer-science literature analysis"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "tenacity>=8.5,<10",
  "pypdf>=5,<6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1"
]

[project.scripts]
paper-research = "paper_research.main:main"

[tool.hatch.build.targets.wheel]
packages = ["services/worker/paper_research"]

[tool.pytest.ini_options]
testpaths = ["services/worker/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC240"]
